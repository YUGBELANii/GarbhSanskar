<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
<title id="title">Sampurnatavam family emblem</title><desc id="desc">A mother and father lovingly cradle their newborn baby inside a circular lotus-inspired emblem.</desc>
<defs>
